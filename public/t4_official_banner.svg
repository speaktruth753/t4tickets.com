    </g>
  </g>

  <!-- Airline Partners Row -->
  <g transform="translate(800, 465)">
    <rect x="-140" y="-12" width="280" height="22" rx="11" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#0A2458">OUR GLOBAL AIRLINE PARTNERS</text>
