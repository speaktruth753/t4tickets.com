      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#04562B">PIA</text>
    </g>
    <g transform="translate(95, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#0A2458">SAUDIA</text>
    </g>
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#007749">AirSial</text>
    </g>
    <g transform="translate(285, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#E21836">Air Arabia</text>
    </g>
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#5C0632">QATAR</text>
    </g>
    <g transform="translate(475, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#E21836">Fly Jinnah</text>
    </g>
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#D71921">Emirates</text>
    </g>
    <g transform="translate(665, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#881B72">flyadeal</text>
    </g>
    <g transform="translate(760, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#005BA6">airblue</text>
    </g>
    <g transform="translate(855, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#F58220">flydubai</text>
    </g>
    <g transform="translate(950, 0)">
      <rect x="0" y="0" width="85" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldRibbon)" stroke-width="1.5" />
      <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#00A099">flynas</text>
    </g>
    <g transform="translate(1045, 0)">
