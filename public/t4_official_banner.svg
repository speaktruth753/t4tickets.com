<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051433" />
      <stop offset="25%" stop-color="#081E48" />
      <stop offset="65%" stop-color="#F2F5F9" />
      <stop offset="100%" stop-color="#E8EEF5" />
    </linearGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="25%" stop-color="#E5BA54" />
      <stop offset="50%" stop-color="#FFF1A8" />
      <stop offset="75%" stop-color="#C29427" />
      <stop offset="100%" stop-color="#7D5C12" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#F7D070" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <linearGradient id="cardGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#EADBBA" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="680" fill="url(#bgGradient)" />

  <!-- Navy Left Arc Curtain -->
  <path d="M 0 0 L 370 0 Q 430 340 340 680 L 0 680 Z" fill="#07193C" />
  <path d="M 370 0 Q 430 340 340 680" fill="none" stroke="url(#goldRibbon)" stroke-width="5" />

  <!-- Left Side: Logo & Urdu Name & Contacts -->
  <!-- Gold Circular Badge -->
  <g transform="translate(190, 140)">
    <!-- Outer Glow & Rings -->
    <circle cx="0" cy="0" r="75" fill="#081D45" stroke="url(#goldMetallic)" stroke-width="7" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="67" fill="none" stroke="url(#goldRibbon)" stroke-width="2" opacity="0.8" />
    <!-- Stylized T4 -->
    <text x="-48" y="24" font-family="'Cinzel', 'Playfair Display', serif" font-size="64" font-weight="900" fill="url(#goldMetallic)">T4</text>
  </g>

  <!-- Urdu Name Calligraphy: محمد عامر عزیز -->
  <text x="190" y="265" text-anchor="middle" font-family="'Noto Nastaliq Urdu', 'Scheherazade New', 'Amiri', serif" font-size="34" font-weight="bold" fill="url(#goldMetallic)">محمد عامر عزیز</text>

  <!-- Contact Pills Left -->
  <!-- WhatsApp KSA -->
  <g transform="translate(50, 310)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#0A224F" stroke="url(#goldRibbon)" stroke-width="2" />
    <circle cx="26" cy="21" r="14" fill="#25D366" />
    <!-- WhatsApp phone icon inside circle -->
    <path d="M 21 16 C 24 13 28 13 31 16 L 31 19 C 29 19 28 20 27 21 C 26 22 25 23 25 25 L 28 25" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="160" y="27" text-anchor="middle" font-family="monospace, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">966502674930</text>
  </g>

  <!-- WhatsApp PK -->
  <g transform="translate(50, 370)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#0A224F" stroke="url(#goldRibbon)" stroke-width="2" />
    <circle cx="26" cy="21" r="14" fill="#25D366" />
    <path d="M 21 16 C 24 13 28 13 31 16 L 31 19 C 29 19 28 20 27 21 C 26 22 25 23 25 25 L 28 25" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="160" y="27" text-anchor="middle" font-family="monospace, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">923017355753</text>
  </g>

  <!-- Email -->
  <g transform="translate(50, 430)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#0A224F" stroke="url(#goldRibbon)" stroke-width="2" />
    <circle cx="26" cy="21" r="14" fill="#D4AF37" />
    <rect x="18" y="15" width="16" height="12" rx="2" fill="#0A224F" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="160" y="27" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">T4tickets@gmail.com</text>
  </g>

  <!-- Center Area: Main Branding -->
  <!-- IATA Logo -->
  <g transform="translate(760, 52)">
    <circle cx="20" cy="0" r="18" fill="#0A2458" stroke="url(#goldRibbon)" stroke-width="1.5" />
    <text x="20" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">IATA</text>
  </g>

  <!-- Main Title: T4 TICKETS -->
  <text x="780" y="145" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="82" font-weight="900" letter-spacing="4" fill="url(#goldMetallic)" filter="url(#cardShadow)">T4 TICKETS</text>

  <!-- AND TRAVELS SERVICES with Wings & Airplane -->
  <g transform="translate(780, 185)">
    <!-- Left gold wing rule -->
    <line x1="-380" y1="-8" x2="-190" y2="-8" stroke="url(#goldRibbon)" stroke-width="3" />
    <text x="0" y="0" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="#0A2458">AND TRAVELS SERVICES</text>
    <!-- Right gold wing rule -->
    <line x1="190" y1="-8" x2="380" y2="-8" stroke="url(#goldRibbon)" stroke-width="3" />
  </g>

  <!-- Urdu Slogan: سستی ترین ٹکٹ ، بہترین سروس ، ہر سفر بے فکر -->
  <text x="780" y="235" text-anchor="middle" font-family="'Noto Nastaliq Urdu', 'Amiri', serif" font-size="30" font-weight="bold" fill="#0A2458">سستی ترین ٹکٹ ، بہترین سروس ، ہر سفر بے فکر</text>

  <!-- Subtitle: INTERNATIONAL & DOMESTIC TICKETING -->
  <text x="780" y="265" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="5" fill="#0A2458">INTERNATIONAL &amp; DOMESTIC TICKETING</text>

  <!-- GALLERY OF SERVICES Gold Pill -->
  <g transform="translate(680, 285)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="1.5" />
    <text x="100" y="18" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#0A2458">GALLERY OF SERVICES</text>
  </g>

  <!-- 7 Services Badges -->
  <g transform="translate(420, 325)">
    <!-- 1. Airline Tickets -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="2" filter="url(#cardShadow)" />
      <rect x="18" y="10" width="60" height="44" rx="10" fill="#0A2458" />
      <text x="48" y="38" text-anchor="middle" font-size="24" fill="#FFFFFF">✈️</text>
      <text x="48" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">AIRLINE</text>
      <text x="48" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">TICKETS</text>
    </g>

    <!-- 2. Visit Visas -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="2" filter="url(#cardShadow)" />
      <rect x="18" y="10" width="60" height="44" rx="10" fill="#0A2458" />
      <text x="48" y="38" text-anchor="middle" font-size="24" fill="#FFFFFF">🛂</text>
      <text x="48" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">VISIT</text>
      <text x="48" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">VISAS</text>
    </g>

    <!-- 3. Umrah Packages -->
