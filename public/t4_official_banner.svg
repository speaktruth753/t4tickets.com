      <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="2" filter="url(#cardShadow)" />
      <rect x="18" y="10" width="60" height="44" rx="10" fill="#0A2458" />
      <text x="48" y="38" text-anchor="middle" font-size="24" fill="#FFFFFF">🕋</text>
      <text x="48" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">UMRAH</text>
      <text x="48" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">PACKAGES</text>
    </g>

    <!-- 4. Travel Insurance -->
    <g transform="translate(330, 0)">
      <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="2" filter="url(#cardShadow)" />
      <rect x="18" y="10" width="60" height="44" rx="10" fill="#0A2458" />
      <text x="48" y="38" text-anchor="middle" font-size="24" fill="#FFFFFF">🛡️</text>
      <text x="48" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">TRAVEL</text>
      <text x="48" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">INSURANCE</text>
    </g>

    <!-- 5. Work Visas -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="2" filter="url(#cardShadow)" />
      <rect x="18" y="10" width="60" height="44" rx="10" fill="#0A2458" />
      <text x="48" y="38" text-anchor="middle" font-size="24" fill="#FFFFFF">💼</text>
      <text x="48" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">WORK</text>
      <text x="48" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">VISAS</text>
    </g>

    <!-- 6. GCC Medical -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="2" filter="url(#cardShadow)" />
      <rect x="18" y="10" width="60" height="44" rx="10" fill="#0A2458" />
      <text x="48" y="38" text-anchor="middle" font-size="24" fill="#FFFFFF">🩺</text>
      <text x="48" y="70" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#0A2458">GCC MEDICAL</text>
      <text x="48" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#0A2458">APPOINTMENT</text>
    </g>

    <!-- 7. Group Tickets -->
    <g transform="translate(660, 0)">
      <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#cardGold)" stroke="url(#goldRibbon)" stroke-width="2" filter="url(#cardShadow)" />
      <rect x="18" y="10" width="60" height="44" rx="10" fill="#0A2458" />
      <text x="48" y="38" text-anchor="middle" font-size="24" fill="#FFFFFF">👥</text>
      <text x="48" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">GROUP</text>
      <text x="48" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0A2458">TICKETS</text>
    </g>
  </g>

  <!-- Right Visuals: Airplane, Kaaba & WhatsApp CTA -->
  <!-- Holy Kaaba Illustration -->
  <g transform="translate(1220, 350)">
    <!-- Base Mosque Terrace -->
    <rect x="-40" y="55" width="220" height="70" fill="#E6ECF5" rx="4" />
    <!-- Clock Tower silhouette -->
    <rect x="130" y="-120" width="30" height="180" fill="#C5D0E0" />
    <polygon points="145,-160 130,-120 160,-120" fill="#B3C0D4" />
    <circle cx="145" cy="-90" r="10" fill="#E8F0FE" stroke="#8EA0B8" stroke-width="1.5" />
    <!-- Kaaba Structure -->
    <rect x="0" y="0" width="100" height="110" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="2" rx="4" />
    <!-- Golden Kiswah Belt (Hizam) -->
    <rect x="0" y="24" width="100" height="14" fill="url(#goldRibbon)" />
    <!-- Golden Door (Bab al-Kaaba) -->
    <rect x="65" y="45" width="22" height="44" fill="url(#goldMetallic)" rx="2" />
  </g>

  <!-- Airplane in Flight -->
  <g transform="translate(1360, 110) rotate(-12) scale(0.95)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="140" ry="24" fill="#FFFFFF" stroke="#BAC7D5" stroke-width="2" />
    <!-- Cockpit Windows -->
    <path d="M 110 -6 Q 130 -4 135 2 L 120 4 Z" fill="#0A2458" />
    <!-- Wings -->
    <polygon points="-30,6 60,8 -50,110 -75,105" fill="#CAD5E2" stroke="#BAC7D5" stroke-width="1.5" />
    <polygon points="10,-6 60,-6 -10,-85 -25,-85" fill="#CAD5E2" stroke="#BAC7D5" stroke-width="1.5" />
    <!-- Jet Engines -->
    <rect x="-10" y="32" width="36" height="16" rx="8" fill="#8898AA" />
    <!-- Tail Fin with Gold T4 Accent -->
    <polygon points="-110,-6 -140,-6 -170,-75 -130,-75" fill="#0A2458" />
    <polygon points="-135,-65 -160,-65 -135,-15" fill="url(#goldRibbon)" />
  </g>

  <!-- Book Now via WhatsApp Badge -->
  <g transform="translate(1160, 425)" filter="url(#cardShadow)">
    <path d="M 0 35 Q 20 0 70 0 L 280 0 Q 300 0 300 35 L 300 50 Q 280 85 230 85 L 30 85 Q 0 85 0 50 Z" fill="#0A2458" stroke="url(#goldRibbon)" stroke-width="2" />
    <text x="140" y="35" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900" fill="url(#goldRibbon)">BOOK NOW</text>
    <text x="140" y="55" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">VIA WHATSAPP</text>
    <text x="140" y="73" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#D0DBEA">Connect with Us Instantly!</text>
    <!-- Big WhatsApp Circle Button -->
    <g transform="translate(260, 42)">
      <circle cx="0" cy="0" r="32" fill="#25D366" stroke="#FFFFFF" stroke-width="3" filter="url(#cardShadow)" />
      <!-- WhatsApp Phone icon -->
