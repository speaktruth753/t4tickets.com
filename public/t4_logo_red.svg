<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant Aviation Red Gradients -->
    <linearGradient id="redRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA4A2" />
      <stop offset="25%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="80%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="redText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEE2E2" />
      <stop offset="65%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2758" />
      <stop offset="75%" stop-color="#071738" />
      <stop offset="100%" stop-color="#030A18" />
    </radialGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Outer Navy Circle with Dark Shadow -->
  <circle cx="100" cy="100" r="94" fill="url(#navyBg)" filter="url(#dropShadow)" />

  <!-- Outer Thick Red Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#redRing)" stroke-width="8" />

  <!-- Inner Thin Accent Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#redRing)" stroke-width="2" opacity="0.85" />

  <!-- Subtle Wing/Flight Arc -->
  <path d="M 35 100 Q 100 135 165 100" fill="none" stroke="url(#redRing)" stroke-width="1.5" opacity="0.4" />

  <!-- Stylized "T4" Monogram -->
  <g filter="url(#redGlow)">
    <!-- T horizontal bar and stem -->
    <path d="M 45 62 L 105 62 L 102 78 L 86 78 L 81 142 L 63 142 L 68 78 L 48 78 Z" fill="url(#redText)" filter="url(#dropShadow)" />
    <!-- 4 shape interlocking -->
    <path d="M 126 62 L 96 114 L 122 114 L 120 142 L 138 142 L 140 114 L 155 114 L 158 98 L 141 98 L 143 62 Z M 121 98 L 109 98 L 124 73 Z" fill="url(#redText)" filter="url(#dropShadow)" />
  </g>
</svg>
