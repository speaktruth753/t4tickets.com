<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="30%" stop-color="#DFB15B" />
      <stop offset="50%" stop-color="#FFF3B0" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8D6B18" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFE57F" />
      <stop offset="60%" stop-color="#DFB15B" />
      <stop offset="90%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#6B4E08" />
    </linearGradient>
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E275A" />
      <stop offset="75%" stop-color="#071738" />
      <stop offset="100%" stop-color="#040C1E" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Navy Circle with Dark Shadow -->
  <circle cx="100" cy="100" r="94" fill="url(#navyBg)" filter="url(#dropShadow)" />

  <!-- Outer Thick Gold Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldRing)" stroke-width="8" />

  <!-- Inner Thin Accent Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldRing)" stroke-width="2" opacity="0.8" />

  <!-- Stylized "T4" Monogram -->
  <g filter="url(#goldGlow)">
    <!-- T horizontal bar -->
    <path d="M 45 62 L 105 62 L 102 78 L 86 78 L 81 142 L 63 142 L 68 78 L 48 78 Z" fill="url(#goldText)" filter="url(#dropShadow)" />
    <!-- 4 shape interlocking -->
    <path d="M 126 62 L 96 114 L 122 114 L 120 142 L 138 142 L 140 114 L 155 114 L 158 98 L 141 98 L 143 62 Z M 121 98 L 109 98 L 124 73 Z" fill="url(#goldText)" filter="url(#dropShadow)" />
  </g>
</svg>
