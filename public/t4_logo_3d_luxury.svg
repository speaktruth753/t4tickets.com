<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- 3D Realistic Lighting & Occlusion Filters -->
    <filter id="render3DShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.6" />
    </filter>

    <filter id="plane3DShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="14" stdDeviation="8" flood-color="#020617" flood-opacity="0.9" />
    </filter>

    <filter id="text3DShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Bevel Gradients (Simulating 45° Key Light from Top-Left) -->
    <linearGradient id="bezelOuter3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="12%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#F6CE55" />
      <stop offset="52%" stop-color="#C68A1B" />
      <stop offset="78%" stop-color="#734B03" />
      <stop offset="92%" stop-color="#3A2300" />
      <stop offset="100%" stop-color="#1F1200" />
    </linearGradient>

    <!-- Reverse Bevel for 3D Inset Ring -->
    <linearGradient id="bezelInner3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241600" />
      <stop offset="25%" stop-color="#5E3E04" />
      <stop offset="55%" stop-color="#BF881C" />
      <stop offset="82%" stop-color="#FDE88E" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Anisotropic Brushed Chrono Dial -->
    <radialGradient id="dialBase3D" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#163773" />
      <stop offset="35%" stop-color="#0A1E45" />
      <stop offset="70%" stop-color="#040F24" />
      <stop offset="100%" stop-color="#010612" />
    </radialGradient>

    <!-- Spherical 3D Dial Dome Reflection -->
    <radialGradient id="domeReflection" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#93C5FD" stop-opacity="0.10" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>

    <!-- 3D Jet Fuselage Cylindrical Shader -->
    <linearGradient id="jetFuselage3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFF9DB" />
      <stop offset="45%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="90%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- 3D Wing Top Facet (Direct Light Catch) -->
    <linearGradient id="wingFacetLit" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- 3D Wing Bottom/Underside Facet (Shadow Side) -->
    <linearGradient id="wingFacetShaded" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="50%" stop-color="#582402" />
      <stop offset="100%" stop-color="#270F00" />
    </linearGradient>

    <!-- 3D Monogram T4 Chrome Gold (Multi-stop physical specular reflection) -->
    <linearGradient id="chromeGold3DFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="48%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="52%" stop-color="#FFFDF5" />
      <stop offset="72%" stop-color="#FCD34D" />
      <stop offset="90%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- 3D Extruded Monogram Side Walls -->
    <linearGradient id="extrusionGoldWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="40%" stop-color="#5A2602" />
      <stop offset="80%" stop-color="#301300" />
      <stop offset="100%" stop-color="#170800" />
    </linearGradient>

    <!-- 3D Orbit Ring Gradient -->
    <linearGradient id="orbitRing3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="55%" stop-color="#B45309" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Diamond Optical Flare -->
    <radialGradient id="starOpticalFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ==================== 3D MEDALLION FOUNDATION ==================== -->
  <g filter="url(#render3DShadow)">
    <!-- 1. Outer 3D Chamfered Bullion Ring -->
    <circle cx="200" cy="200" r="192" fill="url(#bezelOuter3D)" />
    
    <!-- 2. Knurled Chrono Rim (Watchmaker Teeth for Micro-Depth) -->
    <circle cx="200" cy="200" r="187" fill="none" stroke="#261700" stroke-width="2.5" />
    <circle cx="200" cy="200" r="186" fill="none" stroke="url(#bezelOuter3D)" stroke-width="2.2" stroke-dasharray="3, 4.5" />

    <!-- 3. Middle 3D Inward Bevel Ring -->
    <circle cx="200" cy="200" r="177" fill="url(#bezelInner3D)" />

    <!-- 4. Deep Recessed Coin Rim -->
    <circle cx="200" cy="200" r="169" fill="url(#bezelOuter3D)" />
    <circle cx="200" cy="200" r="164" fill="#140C00" />

    <!-- 5. Sunken Titanium Sapphire Dial -->
    <circle cx="200" cy="200" r="162" fill="url(#dialBase3D)" />
    <circle cx="200" cy="200" r="162" fill="url(#domeReflection)" />

    <!-- 6. 3D Spherical Latitude & Longitude Globe Grid (World Travel) -->
    <g opacity="0.35" stroke="#FDE047" stroke-width="1.1" fill="none">
      <!-- Equator & Parallels -->
      <ellipse cx="200" cy="200" rx="155" ry="52" stroke-dasharray="6, 4" />
      <ellipse cx="200" cy="160" rx="142" ry="38" opacity="0.7" />
      <ellipse cx="200" cy="240" rx="142" ry="38" opacity="0.7" />
      <!-- Meridians -->
      <ellipse cx="200" cy="200" rx="55" ry="155" />
      <ellipse cx="200" cy="200" rx="110" ry="155" opacity="0.7" />
      <line x1="200" y1="45" x2="200" y2="355" stroke-width="1.4" opacity="0.8" />
      <line x1="45" y1="200" x2="355" y2="200" stroke-width="1.4" opacity="0.8" />
    </g>

    <!-- 7. Compass Rose Star Points (Subtle 3D Background Relief) -->
    <g opacity="0.3">
      <polygon points="200,60 205,185 200,195 195,185" fill="#FDE68A" />
      <polygon points="200,60 200,195 195,185" fill="#92400E" />
      <polygon points="200,340 205,215 200,205 195,215" fill="#92400E" />
      <polygon points="200,340 200,205 205,215" fill="#FDE68A" />
      <polygon points="60,200 185,195 195,200 185,205" fill="#FDE68A" />
      <polygon points="60,200 195,200 185,205" fill="#92400E" />
      <polygon points="340,200 215,195 205,200 215,205" fill="#92400E" />
      <polygon points="340,200 205,200 215,195" fill="#FDE68A" />
    </g>

    <!-- ==================== 3D ORBITAL FLIGHT TRAJECTORY RING ==================== -->
    <!-- Back section of orbit ring (behind the monogram) -->
    <path d="M 55,235 C 45,150 140,85 270,95 C 335,100 370,130 365,165" 
          fill="none" 
          stroke="url(#orbitRing3D)" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.45" />

    <!-- ==================== 3D MONOLITHIC MONOGRAM "T4" ==================== -->
    <g filter="url(#text3DShadow)">
      <!-- --- EXTRUDED 3D SIDE WALLS (Dark Metallic Depth) --- -->
      <!-- 'T' Extrusion Depth Blocks -->
      <polygon points="85,100 195,100 203,110 93,110" fill="url(#extrusionGoldWall)" />
      <polygon points="195,100 195,130 203,140 203,110" fill="url(#extrusionGoldWall)" />
      <polygon points="160,130 160,250 168,262 168,140" fill="url(#extrusionGoldWall)" />
      <polygon points="120,250 160,250 168,262 128,262" fill="url(#extrusionGoldWall)" />
      <polygon points="120,130 120,250 128,262 128,140" fill="url(#extrusionGoldWall)" opacity="0.7" />

      <!-- '4' Extruded Depth Blocks -->
      <polygon points="230,100 175,205 183,217 238,110" fill="url(#extrusionGoldWall)" />
      <polygon points="175,205 230,205 238,217 183,217" fill="url(#extrusionGoldWall)" />
      <polygon points="265,205 295,205 303,217 273,217" fill="url(#extrusionGoldWall)" />
      <polygon points="265,100 265,250 273,262 273,110" fill="url(#extrusionGoldWall)" />
      <polygon points="230,250 265,250 273,262 238,262" fill="url(#extrusionGoldWall)" />

      <!-- --- 3D MONOGRAM CHROME FRONT FACES (Polished 24K Gold) --- -->
      <!-- 'T' Face with Precision Diamond Chamfers -->
      <path d="M 85,100 L 195,100 L 195,130 L 160,130 L 160,250 L 120,250 L 120,130 L 85,130 Z" 
            fill="url(#chromeGold3DFace)" 
            stroke="#FFFBEB" 
            stroke-width="1.8" 
            stroke-linejoin="round" />

      <!-- '4' Face with Sharp Aviation Bevels -->
      <path d="M 230,100 L 175,205 L 230,205 L 230,250 L 265,250 L 265,205 L 295,205 L 295,175 L 265,175 L 265,100 Z 
               M 230,175 L 203,175 L 230,125 Z" 
            fill="url(#chromeGold3DFace)" 
            stroke="#FFFBEB" 
            stroke-width="1.8" 
            stroke-linejoin="round" />

      <!-- Top Specular Ridge Lines (Razor Edge Light Glint) -->
      <line x1="87" y1="102" x2="193" y2="102" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="232" y1="102" x2="263" y2="102" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="230" y1="102" x2="178" y2="203" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- Front section of Orbit Ring (Crossing over the monogram with 3D depth) -->
    <path d="M 55,235 C 75,305 180,335 295,300 C 350,280 375,240 365,165" 
          fill="none" 
          stroke="url(#orbitRing3D)" 
          stroke-width="7" 
          stroke-linecap="round" 
          filter="url(#hyperGlow)" />

    <!-- ==================== 3D SUPERSONIC AIRLINER JET ==================== -->
    <!-- Soaring diagonally upwards at 45° through the crest -->
    <g transform="translate(265, 115) rotate(-35)" filter="url(#plane3DShadow)">
      <!-- Jet Thrust Flare -->
      <ellipse cx="-45" cy="0" rx="24" ry="5" fill="#38BDF8" opacity="0.8" filter="url(#hyperGlow)" />
      <ellipse cx="-35" cy="0" rx="14" ry="3" fill="#FFFFFF" />

      <!-- Left Swept Wing (Underside Shaded Facet) -->
      <polygon points="0,0 -25,-60 -10,-60 12,0" fill="url(#wingFacetShaded)" />
      <!-- Left Swept Wing (Top Lit Facet) -->
      <polygon points="0,0 -20,-58 -10,-60 15,0" fill="url(#wingFacetLit)" stroke="#FFFFFF" stroke-width="0.8" />
      <!-- Left Winglet (Vertical 3D Fin) -->
      <polygon points="-25,-60 -20,-72 -17,-70 -10,-60" fill="url(#bezelOuter3D)" />

      <!-- Right Swept Wing (Lit Facet) -->
      <polygon points="0,0 -25,60 -10,60 12,0" fill="url(#wingFacetLit)" stroke="#FFFBEB" stroke-width="0.8" />
      <polygon points="-25,60 -20,72 -17,70 -10,60" fill="url(#bezelOuter3D)" />

      <!-- Left Horizontal Tail Stabilizer -->
      <polygon points="-30,0 -42,-24 -35,-24 -24,0" fill="url(#wingFacetLit)" />
      <!-- Right Horizontal Tail Stabilizer -->
      <polygon points="-30,0 -42,24 -35,24 -24,0" fill="url(#wingFacetLit)" />

      <!-- Vertical Tail Fin (Rudder) with 3D Chamfer -->
      <polygon points="-28,0 -45,0 -48,-18 -38,-18" fill="url(#bezelOuter3D)" stroke="#FFFFFF" stroke-width="0.7" />

      <!-- Central Fuselage (Sculpted 3D Streamlined Cylinder) -->
      <path d="M 38,0 Q 22,-8 -32,-7 Q -42,0 -42,0 Q -42,0 -32,7 Q 22,8 38,0 Z" 
            fill="url(#jetFuselage3D)" 
            stroke="#FFFBEB" 
            stroke-width="1.2" />

      <!-- Cockpit Visor Glass (Metallic Sapphire Reflection) -->
      <path d="M 22,-3 Q 28,-1 30,0 Q 28,1 22,3 Q 20,0 22,-3 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="0.6" />

      <!-- Nose Specular Highlight Point -->
      <circle cx="37" cy="0" r="1.8" fill="#FFFFFF" />

      <!-- Jet Engines (Turbines under wings) -->
      <ellipse cx="-6" cy="-18" rx="7" ry="2.8" fill="url(#jetFuselage3D)" stroke="#FFF" stroke-width="0.5" />
      <ellipse cx="-6" cy="18" rx="7" ry="2.8" fill="url(#jetFuselage3D)" stroke="#FFF" stroke-width="0.5" />
    </g>

    <!-- ==================== 3D CURVED RIBBON PEDESTAL ==================== -->
    <g transform="translate(200, 318)" filter="url(#text3DShadow)">
      <!-- 3D Banner Outer Gold Bevel -->
      <path d="M -135,-18 C -70,-28 70,-28 135,-18 C 145,-16 150,-10 148,4 C 145,18 138,24 125,22 C 65,12 -65,12 -125,22 C -138,24 -145,18 -148,4 C -150,-10 -145,-16 -135,-18 Z" 
            fill="url(#bezelOuter3D)" 
            stroke="#1B1000" 
            stroke-width="1.5" />

      <!-- 3D Banner Inner Midnight Inset -->
      <path d="M -130,-14 C -68,-23 68,-23 130,-14 C 138,-13 142,-8 140,2 C 138,12 132,17 122,15 C 63,6 -63,6 -122,15 C -132,17 -138,12 -140,2 C -142,-8 -138,-13 -130,-14 Z" 
            fill="#030C20" 
            stroke="url(#bezelOuter3D)" 
            stroke-width="1.2" />

      <!-- 3D Sculpted Text: TICKETS & TRAVEL -->
      <text x="0" y="3" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Arial Black', sans-serif" 
            font-size="14" 
            font-weight="900" 
            letter-spacing="5" 
            fill="url(#chromeGold3DFace)" 
            stroke="#FFFBEB" 
            stroke-width="0.4"
            filter="url(#hyperGlow)">TICKETS</text>

      <!-- Micro Subtitle: TRAVEL SERVICES -->
      <text x="0" y="14" 
            text-anchor="middle" 
            font-family="'Montserrat', sans-serif" 
            font-size="6" 
            font-weight="800" 
            letter-spacing="3" 
            fill="#FDE047">TRAVEL SERVICES</text>
    </g>

    <!-- ==================== DIAMOND SPECULAR OPTICAL FLARES ==================== -->
    <!-- Glint 1: Top of 'T' Bar -->
    <g transform="translate(85, 100)" filter="url(#hyperGlow)">
      <circle cx="0" cy="0" r="16" fill="url(#starOpticalFlare)" />
      <path d="M -16,0 L 16,0 M 0,-16 L 0,16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>

    <!-- Glint 2: Peak of '4' Crossbar -->
    <g transform="translate(295, 175)" filter="url(#hyperGlow)">
      <circle cx="0" cy="0" r="12" fill="url(#starOpticalFlare)" />
      <path d="M -12,0 L 12,0 M 0,-12 L 0,12" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Glint 3: Jet Nose Cone Flare -->
    <g transform="translate(295, 95)" filter="url(#hyperGlow)">
      <circle cx="0" cy="0" r="10" fill="url(#starOpticalFlare)" />
      <path d="M -8,0 L 8,0 M 0,-8 L 0,8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>

    <!-- Glint 4: Medallion 12 O'Clock Crown Point -->
    <g transform="translate(200, 10)" filter="url(#hyperGlow)">
      <circle cx="0" cy="0" r="12" fill="url(#starOpticalFlare)" />
      <path d="M -10,0 L 10,0 M 0,-10 L 0,10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
  </g>
</svg>
